<!-- UPDATED HOMEPAGE NEWSLETTER FORM -->
<section style="background: var(--paper-warm); padding: 40px 28px; margin: 40px 0 0 0;">
  <div class="wrap" style="max-width: 600px; margin: 0 auto;">
    <h3 style="font-family: 'Fraunces', serif; font-size: 24px; color: var(--teal-deep); margin-bottom: 12px;">
      Get weekly BC rebate insights
    </h3>
    <p style="color: var(--ink-soft); margin-bottom: 24px; font-size: 15px;">
      Each week: one city's local incentives, what's new in rebates, and strategy tips. No spam. Unsubscribe anytime.
    </p>

    <form id="homepage-newsletter-form" style="display: flex; gap: 12px; flex-wrap: wrap;">
      <input
        type="email"
        placeholder="Your email"
        required
        style="flex: 1; min-width: 200px; padding: 12px 16px; border: 1px solid var(--rule); border-radius: 8px; font-size: 14px;"
      />
      <button
        type="submit"
        style="background: var(--amber); color: #fff; padding: 12px 24px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; white-space: nowrap;"
      >
        Join Free →
      </button>
    </form>

    <p id="homepage-form-message" style="display:none; margin-top: 12px; font-size: 14px; line-height: 1.6;"></p>
  </div>
</section>

<script>
const RESEND_API_KEY = 'YOUR_API_KEY_HERE';  // Get from Resend dashboard → Settings → API Keys
const AUDIENCE_ID = 'YOUR_AUDIENCE_ID_HERE';  // Get from Resend dashboard → Audiences

document.getElementById('homepage-newsletter-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const email = this.querySelector('input[type="email"]').value;
  const button = this.querySelector('button');
  const messageEl = document.getElementById('homepage-form-message');

  // Disable button while sending
  button.disabled = true;
  const originalText = button.textContent;
  button.textContent = 'Signing up...';

  try {
    const response = await fetch(`https://api.resend.com/audiences/${AUDIENCE_ID}/contacts`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${RESEND_API_KEY}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        email: email,
        unsubscribed: false
      })
    });

    if (response.ok) {
      messageEl.style.display = 'block';
      messageEl.style.color = '#2d6a4f';
      messageEl.innerHTML = '✓ <strong>You\'re in!</strong> First email arrives tomorrow. Check spam if you don\'t see it.';
      this.reset();
      button.textContent = originalText;
      button.disabled = false;
    } else {
      const error = await response.json();
      if (error.message && error.message.includes('already exists')) {
        messageEl.style.display = 'block';
        messageEl.style.color = '#2d6a4f';
        messageEl.innerHTML = '✓ <strong>You\'re already signed up!</strong> First email comes tomorrow.';
      } else {
        throw new Error(error.message || 'Signup failed');
      }
      button.textContent = originalText;
      button.disabled = false;
    }
  } catch (error) {
    messageEl.style.display = 'block';
    messageEl.style.color = '#d4751c';
    messageEl.innerHTML = '⚠ Something went wrong. <strong>Try again</strong> or email us.';
    button.textContent = originalText;
    button.disabled = false;
    console.error('Newsletter signup error:', error);
  }
});
</script>
