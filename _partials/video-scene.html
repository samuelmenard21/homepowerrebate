<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter+Tight:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:'Inter Tight',system-ui,sans-serif}
.v{position:relative;width:1080px;height:1920px;padding:150px 96px 380px;display:flex;flex-direction:column;justify-content:space-between}
.v.light{background:#faf7f2;color:#0a2a2e}
.v.dark{background:radial-gradient(90% 55% at 100% 0%,rgba(232,138,46,.22),rgba(232,138,46,0) 60%),linear-gradient(165deg,#0f5361 0%,#08363f 60%,#062c33 100%);color:#faf7f2}
.logo{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:46px;letter-spacing:-.01em}
.logo b{color:#e88a2e}
.light .logo b{color:#d4751c}
.mid{display:flex;flex-direction:column;gap:36px}
.kick{align-self:flex-start;font-weight:700;font-size:38px;padding:12px 28px;border-radius:999px;background:#ffe8c2;color:#7a4a00}
.dark .kick{background:rgba(255,232,194,.16);color:#ffd9a0}
h1{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:112px;line-height:1.04;letter-spacing:-.02em}
.big{font-size:190px;line-height:1}
h1 em{font-style:normal;color:#e88a2e}
.light h1 em{color:#d4751c}
.sub{font-size:58px;line-height:1.3;font-weight:500;opacity:.92}
.bot{display:flex;flex-direction:column;gap:28px}
.src{font-size:34px;font-weight:500;opacity:.75}
.dots{display:flex;gap:14px}
.dots i{display:block;width:56px;height:10px;border-radius:6px;background:currentColor;opacity:.22}
.dots i.on{opacity:1;background:#e88a2e}
</style></head><body>
<div class="v" id="v"><div class="logo">Home<b>Power</b>Rebate</div><div class="mid"><div class="kick" id="kick"></div><h1 id="h"></h1><p class="sub" id="sub"></p></div><div class="bot"><div class="src" id="src"></div><div class="dots" id="dots"></div></div></div>
<script>
window.setScene=function(d){
  var v=document.getElementById('v'); v.className='v '+(d.theme||'light');
  var k=document.getElementById('kick'); k.textContent=d.kicker||''; k.style.display=d.kicker?'':'none';
  var h=document.getElementById('h'); h.innerHTML=d.headline||''; h.className=d.big?'big':''; h.style.fontSize=d.size?d.size+'px':'';
  var s=document.getElementById('sub'); s.textContent=d.sub||''; s.style.display=d.sub?'':'none';
  document.getElementById('src').textContent=d.foot||'';
  var dots=document.getElementById('dots'); dots.innerHTML=''; for(var i=0;i<d.total;i++){var e=document.createElement('i'); if(i===d.index) e.className='on'; dots.appendChild(e);}
  return document.fonts.ready;
};
</script></body></html>
