<svg viewBox="0 0 720 462" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter Tight, -apple-system, sans-serif">
<title>BC home-energy rebates you can stack (verified September 2026)</title>
<rect width="720" height="462" rx="14" fill="#faf7f2"/>
<text x="24" y="40" font-size="20" font-weight="700" fill="#0a2a2e">Stack your BC home-energy rebates</text>
<text x="24" y="60" font-size="13" fill="#1a3d42">Money you keep — layer them for a bigger total</text>
<text x="24" y="83" font-size="14" font-weight="600" fill="#0a2a2e">Heat pump</text>
<rect x="150" y="66" width="301" height="24" rx="5" fill="#f2c9a0"/>
<rect x="150" y="66" width="93" height="24" rx="5" fill="#d4751c"/>
<text x="700" y="83" font-size="14" font-weight="700" fill="#0a2a2e" text-anchor="end">up to $4,000*</text>
<text x="24" y="125" font-size="14" font-weight="600" fill="#0a2a2e">Insulation</text>
<rect x="150" y="108" width="127" height="24" rx="5" fill="#0d4f5c"/>
<text x="700" y="125" font-size="14" font-weight="700" fill="#0a2a2e" text-anchor="end">up to $5,500</text>
<text x="24" y="167" font-size="14" font-weight="600" fill="#0a2a2e">Solar</text>
<rect x="150" y="150" width="116" height="24" rx="5" fill="#0d4f5c"/>
<text x="700" y="167" font-size="14" font-weight="700" fill="#0a2a2e" text-anchor="end">$5,000</text>
<text x="24" y="209" font-size="14" font-weight="600" fill="#0a2a2e">Home battery</text>
<rect x="150" y="192" width="116" height="24" rx="5" fill="#0d4f5c"/>
<text x="700" y="209" font-size="14" font-weight="700" fill="#0a2a2e" text-anchor="end">up to $5,000</text>
<text x="24" y="251" font-size="14" font-weight="600" fill="#0a2a2e">Water heater</text>
<rect x="150" y="234" width="23" height="24" rx="5" fill="#0d4f5c"/>
<text x="700" y="251" font-size="14" font-weight="700" fill="#0a2a2e" text-anchor="end">up to $1,000</text>
<text x="24" y="293" font-size="14" font-weight="600" fill="#0a2a2e">Windows &amp; doors</text>
<rect x="150" y="276" width="46" height="24" rx="5" fill="#0d4f5c"/>
<text x="700" y="293" font-size="14" font-weight="700" fill="#0a2a2e" text-anchor="end">up to $2,000</text>
<text x="24" y="335" font-size="14" font-weight="600" fill="#0a2a2e">EV charger</text>
<rect x="150" y="318" width="13" height="24" rx="5" fill="#0d4f5c"/>
<text x="700" y="335" font-size="14" font-weight="700" fill="#0a2a2e" text-anchor="end">up to $550</text>
<line x1="24" y1="366" x2="696" y2="366" stroke="#d9d0c1" stroke-width="1"/>
<text x="24" y="392" font-size="16" font-weight="700" fill="#0a2a2e">Combined (BC Hydro home)</text>
<text x="700" y="392" font-size="18" font-weight="800" fill="#d4751c" text-anchor="end">up to ~$23,000</text>
<text x="24" y="420" font-size="12" fill="#1a3d42">* BC Hydro, when a heat pump replaces electric heat (+ up to $1,000 bonus to Oct 31, 2026). Light bar: income-qualified</text>
<text x="24" y="437" font-size="12" fill="#1a3d42">households switching from gas, oil or propane can get up to $13,000 through CleanBC instead.</text>
<text x="24" y="454" font-size="11" fill="#6b8e7f">Sources: BC Hydro and CleanBC program pages, checked September 2026. FortisBC areas differ.</text>
</svg>
