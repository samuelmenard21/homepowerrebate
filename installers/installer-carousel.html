<section class="installer-carousel-section" style="margin: 60px 0; padding: 40px 28px; max-width: 1100px; margin-left: auto; margin-right: auto; border-top: 1px solid #d9d0c1;">
  <div style="margin-bottom: 32px;">
    <p style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #d4751c; margin-bottom: 8px;">Trusted Partners</p>
    <h2 style="font-size: 28px; font-weight: 600; color: #0a2a2e; margin-bottom: 8px; font-family: 'Fraunces', serif;">Top Heat Pump Installers in [CITY]</h2>
    <p style="font-size: 15px; color: #666; margin-bottom: 20px;">HPCN-certified, 4+ stars, verified by Google. Browse and pick one.</p>
  </div>
  <div style="display: flex; gap: 12px; margin-bottom: 28px;">
    <button class="carousel-filter-btn active" data-filter="all" style="background: #d4751c; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px;">Top 5</button>
    <button class="carousel-filter-btn" data-filter="recommended" style="background: #f5efe5; color: #0a2a2e; border: 1px solid #d9d0c1; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px;">HomePowerRebate Recommended</button>
  </div>
  <div style="position: relative;">
    <div class="carousel-container" style="background: #fff; border: 2px solid #d9d0c1; border-radius: 12px; padding: 40px 28px; min-height: 400px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; transition: border-color 0.2s; position: relative;" onclick="window.location = document.querySelector('.carousel-profile-link').href">
      <div style="display: flex; align-items: start; justify-content: space-between; margin-bottom: 20px;">
        <div>
          <h3 class="carousel-installer-name" style="font-size: 24px; font-weight: 700; color: #0a2a2e; margin-bottom: 4px;">Loading...</h3>
          <p class="carousel-installer-specialty" style="font-size: 14px; color: #d4751c; font-weight: 600; margin-bottom: 12px;">Heat Pump Installation</p>
        </div>
        <div style="text-align: right;">
          <div class="carousel-installer-rating" style="font-size: 32px; font-weight: 700; color: #d4751c;">4.9★</div>
          <p class="carousel-installer-reviews" style="font-size: 12px; color: #666;">47 reviews</p>
        </div>
      </div>
      <p class="carousel-installer-location" style="font-size: 14px; color: #666; margin-bottom: 16px;">📍 Location</p>
      <p class="carousel-installer-description" style="font-size: 15px; color: #666; line-height: 1.6; margin-bottom: 24px; min-height: 60px;">Description</p>
      <div style="display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap;">
        <a class="carousel-installer-phone" href="tel:+1" style="flex: 1; min-width: 100px; text-align: center; background: #f5efe5; color: #0d4f5c; padding: 14px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px;" onclick="event.stopPropagation()">📞 Call</a>
        <a class="carousel-installer-website" href="#" target="_blank" style="flex: 1; min-width: 100px; text-align: center; background: #d4751c; color: white; padding: 14px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px;" onclick="event.stopPropagation()">🌐 Website</a>
        <a class="carousel-profile-link" href="#" style="flex: 1; min-width: 140px; text-align: center; background: #0d4f5c; color: white; padding: 14px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px;" onclick="event.stopPropagation()">📋 Full Profile</a>
      </div>
    </div>
    <button class="carousel-prev" style="position: absolute; left: -60px; top: 50%; transform: translateY(-50%); background: #d4751c; color: white; border: none; width: 48px; height: 48px; border-radius: 50%; font-size: 24px; cursor: pointer; z-index: 10;">‹</button>
    <button class="carousel-next" style="position: absolute; right: -60px; top: 50%; transform: translateY(-50%); background: #d4751c; color: white; border: none; width: 48px; height: 48px; border-radius: 50%; font-size: 24px; cursor: pointer; z-index: 10;">›</button>
  </div>
  <style>
    @media (max-width: 768px) {
      .carousel-prev, .carousel-next {
        left: auto !important;
        right: auto !important;
        width: 56px !important;
        height: 56px !important;
        font-size: 32px !important;
      }
      .carousel-prev {
        left: 12px !important;
      }
      .carousel-next {
        right: 12px !important;
      }
    }
  </style>
  </div>
  <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 28px;">
    <span class="carousel-counter" style="font-size: 14px; font-weight: 600; color: #0a2a2e;">1 of 5</span>
    <div class="carousel-dots" style="display: flex; gap: 6px;"></div>
  </div>
</section>
<script>
class InstallerCarousel {
  constructor() {
    this.allInstallers = [];
    this.filteredInstallers = [];
    this.currentIndex = 0;
    this.currentFilter = 'all';
    this.cityName = '[CITY]';
    this.init();
  }
  async init() {
    await this.fetchInstallers();
    this.setupEventListeners();
    this.render();
  }
  async fetchInstallers() {
    try {
      const citySlug = this.cityName.toLowerCase().replace(/ /g, '-').replace(/\./g, '');
      const response = await fetch(`/installers/json/${citySlug}.json`);
      this.allInstallers = await response.json();
      this.updateFiltered();
    } catch (error) {
      console.error('Failed to load installers:', error);
    }
  }
  updateFiltered() {
    if (this.currentFilter === 'all') {
      this.filteredInstallers = this.allInstallers.slice(0, 5);
    } else {
      this.filteredInstallers = this.allInstallers.filter(i => i.recommended);
    }
    this.currentIndex = 0;
    this.render();
  }
  setupEventListeners() {
    document.querySelectorAll('.carousel-filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.carousel-filter-btn').forEach(b => {
          b.style.background = b === e.target ? '#d4751c' : '#f5efe5';
          b.style.color = b === e.target ? 'white' : '#0a2a2e';
        });
        this.currentFilter = e.target.dataset.filter;
        this.updateFiltered();
      });
    });
    document.querySelector('.carousel-prev').addEventListener('click', () => this.prev());
    document.querySelector('.carousel-next').addEventListener('click', () => this.next());
  }
  prev() {
    this.currentIndex = (this.currentIndex - 1 + this.filteredInstallers.length) % this.filteredInstallers.length;
    this.render();
  }
  next() {
    this.currentIndex = (this.currentIndex + 1) % this.filteredInstallers.length;
    this.render();
  }
  render() {
    if (this.filteredInstallers.length === 0) return;
    const installer = this.filteredInstallers[this.currentIndex];
    document.querySelector('.carousel-installer-name').textContent = installer.name;
    document.querySelector('.carousel-installer-specialty').textContent = installer.specialty || 'Heat Pump Installation';
    document.querySelector('.carousel-installer-rating').textContent = installer.rating.toFixed(1) + '★';
    document.querySelector('.carousel-installer-reviews').textContent = installer.reviews + ' reviews';
    document.querySelector('.carousel-installer-location').textContent = '📍 ' + installer.location;
    document.querySelector('.carousel-installer-description').textContent = installer.description;
    document.querySelector('.carousel-installer-phone').href = 'tel:' + installer.phone;
    document.querySelector('.carousel-installer-website').href = installer.website;
    document.querySelector('.carousel-profile-link').href = installer.profileUrl;
    // Set image if available
    const img = document.querySelector('.carousel-installer-image');
    if (img && installer.image_url) {
      img.src = installer.image_url;
      img.style.display = 'block';
    } else if (img) {
      img.style.display = 'none';
    }
    document.querySelector('.carousel-counter').textContent = `${this.currentIndex + 1} of ${this.filteredInstallers.length}`;
  }
}
document.addEventListener('DOMContentLoaded', () => { new InstallerCarousel(); });
</script>
