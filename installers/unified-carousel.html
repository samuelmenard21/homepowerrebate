<section class="unified-carousel-section" style="margin: 60px 0; padding: 40px 28px; max-width: 1100px; margin-left: auto; margin-right: auto; border-top: 1px solid #d9d0c1;">
  <div style="margin-bottom: 32px;">
    <p style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #d4751c; margin-bottom: 8px;">Trusted Partners</p>
    <h2 style="font-size: 28px; font-weight: 600; color: #0a2a2e; margin-bottom: 8px; font-family: 'Fraunces', serif;">Top Installers in [CITY]</h2>
    <p style="font-size: 15px; color: #666; margin-bottom: 20px;">HPCN-certified, 4+ stars, verified by Google. Browse and pick one.</p>
  </div>
  <div style="display: flex; gap: 12px; margin-bottom: 28px; flex-wrap: wrap;">
    <button class="unified-carousel-type-btn active" data-type="all" style="background: #d4751c; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px;">Heat Pumps</button>
    <button class="unified-carousel-type-btn" data-type="solar" style="background: #f5efe5; color: #0a2a2e; border: 1px solid #d9d0c1; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px;">Solar</button>
  </div>
  <div class="unified-carousel-wrapper" style="display: flex; flex-direction: column;">
    <div style="position: relative;">
      <div class="unified-carousel-container" style="background: #fff; border: 2px solid #d9d0c1; border-radius: 12px; padding: 40px 28px; min-height: 350px; display: flex; flex-direction: column; justify-content: space-between; gap: 20px;">
        <div style="display: flex; gap: 28px; flex: 1;">
          <!-- Image Column (Left) -->
          <div style="flex-shrink: 0; width: 280px;">
            <img class="unified-carousel-installer-image" src="" style="width: 100%; height: 280px; object-fit: cover; border-radius: 8px; background: #f0f0f0;" alt="Installer photo" />
          </div>
          <!-- Content Column (Right) -->
          <div style="flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
            <!-- Name & Rating Header -->
            <div>
              <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">
                <div>
                  <h3 class="unified-carousel-installer-name" style="font-size: 24px; font-weight: 700; color: #0a2a2e; margin-bottom: 4px;">Loading...</h3>
                  <p class="unified-carousel-installer-specialty" style="font-size: 13px; color: #d4751c; font-weight: 600;">Installation</p>
                </div>
                <div style="text-align: center; flex-shrink: 0;">
                  <div class="unified-carousel-installer-rating" style="font-size: 28px; font-weight: 700; color: #d4751c;">4.9★</div>
                  <p class="unified-carousel-installer-reviews" style="font-size: 11px; color: #666; margin-top: 2px;">47 reviews</p>
                </div>
              </div>
              <!-- Location -->
              <p class="unified-carousel-installer-location" style="font-size: 13px; color: #666; margin-top: 12px;">📍 Location</p>
            </div>
            <!-- Description -->
            <p class="unified-carousel-installer-description" style="font-size: 14px; color: #666; line-height: 1.6; margin: 12px 0; min-height: 50px;">Description</p>
          </div>
        </div>
        <!-- Buttons (Below, Full Width) -->
        <div style="display: flex; gap: 12px; border-top: 1px solid #e5e7eb; padding-top: 16px;">
          <a class="unified-carousel-installer-phone" href="tel:+1" style="flex: 1; text-align: center; background: #f5efe5; color: #0d4f5c; padding: 12px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px;">📞 Call</a>
          <a class="unified-carousel-installer-website" href="#" target="_blank" style="flex: 1; text-align: center; background: #d4751c; color: white; padding: 12px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px;">🌐 Website</a>
        </div>
      </div>
      <button class="unified-carousel-prev" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); background: #d4751c; color: white; border: none; width: 48px; height: 48px; border-radius: 50%; font-size: 24px; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center;">‹</button>
      <button class="unified-carousel-next" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: #d4751c; color: white; border: none; width: 48px; height: 48px; border-radius: 50%; font-size: 24px; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center;">›</button>
    </div>
    <div class="unified-carousel-mobile-nav" style="display: none; justify-content: center; align-items: center; gap: 12px; margin-top: 16px;">
      <button class="unified-carousel-prev-mobile" style="background: #d4751c; color: white; border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;">‹</button>
      <span class="unified-carousel-counter" style="font-size: 14px; font-weight: 600; color: #0a2a2e; min-width: 50px; text-align: center;">1 of 5</span>
      <button class="unified-carousel-next-mobile" style="background: #d4751c; color: white; border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;">›</button>
    </div>
  </div>
  <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 28px;">
    <span class="unified-carousel-counter" style="font-size: 14px; font-weight: 600; color: #0a2a2e;">1 of 5</span>
    <div class="unified-carousel-dots" style="display: flex; gap: 6px;"></div>
  </div>
  <style>
    /* Desktop: 2-column layout (image left, content right) */
    @media (min-width: 769px) {
      .unified-carousel-container {
        flex-direction: column !important;
      }
    }

    /* Tablet: Adjusted spacing */
    @media (max-width: 768px) {
      .unified-carousel-section {
        padding: 40px 16px !important;
        margin: 40px 0 !important;
      }

      .unified-carousel-container {
        padding: 24px 16px !important;
        min-height: auto !important;
      }

      /* On tablet, revert to vertical stack with smaller image */
      div[style*="display: flex"][style*="gap: 28px"] {
        flex-direction: column !important;
        gap: 16px !important;
      }

      div[style*="width: 280px"] {
        width: 100% !important;
      }

      div[style*="width: 280px"] img {
        height: 200px !important;
      }
    }

    /* Mobile: Full vertical stack */
    @media (max-width: 480px) {
      .unified-carousel-prev,
      .unified-carousel-next {
        display: none !important;
      }

      .unified-carousel-mobile-nav {
        display: flex !important;
      }

      /* Stack everything vertically */
      div[style*="display: flex"][style*="gap: 28px"] {
        flex-direction: column !important;
        gap: 16px !important;
      }

      div[style*="width: 280px"] {
        width: 100% !important;
      }

      div[style*="width: 280px"] img {
        height: 180px !important;
      }

      .unified-carousel-container {
        padding: 16px 12px !important;
      }

      .unified-carousel-installer-name {
        font-size: 20px !important;
      }
    }
  </style>
</section>
<script>
class UnifiedInstallerCarousel {
  constructor() {
    this.heatPumpInstallers = [];
    this.solarInstallers = [];
    this.allRecommended = [];
    this.filteredInstallers = [];
    this.currentIndex = 0;
    this.currentType = 'all';
    this.cityName = '[CITY]';
    this.init();
  }
  async init() {
    await this.fetchInstallers();
    this.setupEventListeners();
    this.render();
  }
  async fetchInstallers() {
    try {
      const citySlug = this.cityName.toLowerCase().replace(/ /g, '-').replace(/\./g, '');
      const [hpResponse, solarResponse] = await Promise.all([
        fetch(`/installers/json/${citySlug}.json`),
        fetch(`/installers/json/solar/${citySlug}.json`)
      ]);
      this.heatPumpInstallers = await hpResponse.json();
      this.solarInstallers = await solarResponse.json();
      this.allRecommended = [...this.heatPumpInstallers, ...this.solarInstallers].filter(i => i.recommended);
      this.updateFiltered();
    } catch (error) {
      console.error('Failed to load installers:', error);
    }
  }
  updateFiltered() {
    if (this.currentType === 'all') {
      this.filteredInstallers = this.heatPumpInstallers.slice(0, 5);
    } else if (this.currentType === 'solar') {
      this.filteredInstallers = this.solarInstallers.slice(0, 5);
    } else if (this.currentType === 'recommended') {
      this.filteredInstallers = this.allRecommended;
    }
    this.currentIndex = 0;
    this.render();
  }
  setupEventListeners() {
    document.querySelectorAll('.unified-carousel-type-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.unified-carousel-type-btn').forEach(b => {
          b.style.background = b === e.target ? '#d4751c' : '#f5efe5';
          b.style.color = b === e.target ? 'white' : '#0a2a2e';
        });
        this.currentType = e.target.dataset.type;
        this.updateFiltered();
      });
    });
    document.querySelector('.unified-carousel-prev').addEventListener('click', () => this.prev());
    document.querySelector('.unified-carousel-next').addEventListener('click', () => this.next());
    document.querySelector('.unified-carousel-prev-mobile').addEventListener('click', () => this.prev());
    document.querySelector('.unified-carousel-next-mobile').addEventListener('click', () => this.next());
  }
  prev() {
    this.currentIndex = (this.currentIndex - 1 + this.filteredInstallers.length) % this.filteredInstallers.length;
    this.render();
  }
  next() {
    this.currentIndex = (this.currentIndex + 1) % this.filteredInstallers.length;
    this.render();
  }
  render() {
    if (this.filteredInstallers.length === 0) return;
    const installer = this.filteredInstallers[this.currentIndex];
    document.querySelector('.unified-carousel-installer-image').src = installer.image_url || '';
    document.querySelector('.unified-carousel-installer-name').textContent = installer.name;
    document.querySelector('.unified-carousel-installer-specialty').textContent = installer.specialty || 'Installation';
    document.querySelector('.unified-carousel-installer-rating').textContent = installer.rating.toFixed(1) + '★';
    document.querySelector('.unified-carousel-installer-reviews').textContent = installer.reviews + ' reviews';
    document.querySelector('.unified-carousel-installer-location').textContent = '📍 ' + installer.location;
    document.querySelector('.unified-carousel-installer-description').textContent = installer.description;
    document.querySelector('.unified-carousel-installer-phone').href = 'tel:' + installer.phone;
    document.querySelector('.unified-carousel-installer-website').href = installer.website;
    const counters = document.querySelectorAll('.unified-carousel-counter');
    counters.forEach(c => c.textContent = `${this.currentIndex + 1} of ${this.filteredInstallers.length}`);
  }
}
document.addEventListener('DOMContentLoaded', () => { new UnifiedInstallerCarousel(); });
</script>
