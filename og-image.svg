<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#08363f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d4f5c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Top accent bar -->
  <rect width="1200" height="12" fill="#d4751c"/>

  <!-- Logo -->
  <text x="60" y="100" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="#faf7f2">
    HomePowerRebate
  </text>

  <!-- Main headline line 1 -->
  <text x="60" y="190" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="#ffffff">
    See Your Rebates
  </text>

  <!-- Main headline line 2 -->
  <text x="60" y="280" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="#ffffff">
    in 20 Seconds
  </text>

  <!-- Subheading -->
  <text x="60" y="420" font-family="Arial, sans-serif" font-size="24" fill="rgba(250, 247, 242, 0.9)">
    Free assessment → matched with vetted installers
  </text>

  <!-- Value prop -->
  <text x="60" y="500" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#d4751c">
    Up to $35K in Rebates
  </text>

  <!-- CTA button -->
  <rect x="60" y="540" width="280" height="70" rx="8" fill="#d4751c"/>
  <text x="200" y="585" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#08363f" text-anchor="middle">
    Start Assessment
  </text>

  <!-- Bottom accent -->
  <rect y="620" width="1200" height="10" fill="rgba(212, 117, 28, 0.3)"/>
</svg>