<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient: deep teal to warm dark -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2a2e"/>
      <stop offset="55%" stop-color="#0d4f5c"/>
      <stop offset="100%" stop-color="#08363f"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#e88a2e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e88a2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#2d6a4f" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2d6a4f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e88a2e"/>
      <stop offset="100%" stop-color="#d4751c"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- House illustration, right side -->
  <g transform="translate(846,110)">
    <!-- soft ground shadow -->
    <ellipse cx="160" cy="410" rx="190" ry="18" fill="#000000" opacity="0.18"/>

    <!-- house body -->
    <path d="M10 210 L10 400 L310 400 L310 210 L160 70 Z" fill="#0a2a2e" stroke="rgba(250,247,242,0.15)" stroke-width="2"/>
    <!-- roof plane (lighter, catching light) -->
    <path d="M10 210 L160 70 L310 210 Z" fill="#123c44"/>
    <!-- roof ridge highlight -->
    <line x1="160" y1="70" x2="10" y2="210" stroke="rgba(250,247,242,0.2)" stroke-width="2"/>

    <!-- solar panel array on roof -->
    <g transform="translate(58,132) rotate(-32)">
      <rect x="0" y="0" width="118" height="60" rx="4" fill="#08222a" stroke="#e88a2e" stroke-width="2" opacity="0.9"/>
      <line x1="29.5" y1="0" x2="29.5" y2="60" stroke="#e88a2e" stroke-width="1.5" opacity="0.5"/>
      <line x1="59" y1="0" x2="59" y2="60" stroke="#e88a2e" stroke-width="1.5" opacity="0.5"/>
      <line x1="88.5" y1="0" x2="88.5" y2="60" stroke="#e88a2e" stroke-width="1.5" opacity="0.5"/>
      <line x1="0" y1="30" x2="118" y2="30" stroke="#e88a2e" stroke-width="1.5" opacity="0.5"/>
    </g>

    <!-- window -->
    <rect x="46" y="255" width="58" height="58" rx="4" fill="#e88a2e" opacity="0.14" stroke="rgba(232,138,46,0.55)" stroke-width="2"/>
    <line x1="75" y1="255" x2="75" y2="313" stroke="rgba(232,138,46,0.4)" stroke-width="1.5"/>
    <line x1="46" y1="284" x2="104" y2="284" stroke="rgba(232,138,46,0.4)" stroke-width="1.5"/>

    <!-- door -->
    <rect x="144" y="318" width="52" height="82" rx="3" fill="#123c44" stroke="rgba(250,247,242,0.18)" stroke-width="1.5"/>
    <circle cx="184" cy="360" r="2.5" fill="rgba(250,247,242,0.5)"/>

    <!-- heat pump unit, beside house -->
    <rect x="228" y="330" width="88" height="70" rx="8" fill="#08222a" stroke="rgba(250,247,242,0.2)" stroke-width="2"/>
    <circle cx="272" cy="365" r="21" fill="none" stroke="#e88a2e" stroke-width="3" opacity="0.9"/>
    <circle cx="272" cy="365" r="4.5" fill="#e88a2e"/>
    <line x1="272" y1="348" x2="272" y2="356" stroke="#e88a2e" stroke-width="2.5"/>
    <line x1="272" y1="374" x2="272" y2="382" stroke="#e88a2e" stroke-width="2.5"/>
    <line x1="255" y1="365" x2="263" y2="365" stroke="#e88a2e" stroke-width="2.5"/>
    <line x1="281" y1="365" x2="289" y2="365" stroke="#e88a2e" stroke-width="2.5"/>
  </g>

  <!-- Rebate coin, tucked beside the house base -->
  <g transform="translate(818,470)">
    <circle cx="0" cy="0" r="38" fill="url(#amberGrad)" filter="url(#softShadow)"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#faf7f2" stroke-width="2" opacity="0.35"/>
    <text x="0" y="12" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#08222a" text-anchor="middle">$</text>
  </g>

  <!-- Top accent line -->
  <rect width="1200" height="6" fill="url(#amberGrad)"/>

  <!-- Eyebrow badge -->
  <rect x="60" y="66" width="230" height="34" rx="17" fill="rgba(232,138,46,0.14)" stroke="rgba(232,138,46,0.5)" stroke-width="1.5"/>
  <circle cx="80" cy="83" r="4" fill="#e88a2e"/>
  <text x="94" y="89" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="0.5" fill="#e88a2e">SERVING 18 BC CITIES</text>

  <!-- Logo -->
  <text x="60" y="148" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#faf7f2">Home<tspan fill="#e88a2e" font-style="italic">Power</tspan>Rebate</text>

  <!-- Headline -->
  <text x="58" y="240" font-family="Georgia, serif" font-size="66" font-weight="700" fill="#ffffff" letter-spacing="-1">See your rebates</text>
  <text x="58" y="310" font-family="Georgia, serif" font-size="66" font-weight="700" fill="#ffffff" letter-spacing="-1">in <tspan fill="#e88a2e" font-style="italic">20 seconds.</tspan></text>

  <!-- Subheadline -->
  <text x="60" y="360" font-family="Arial, sans-serif" font-size="22" fill="rgba(250,247,242,0.72)">Free assessment, matched with vetted local installers.</text>

  <!-- Stat card -->
  <rect x="60" y="410" width="330" height="130" rx="16" fill="url(#cardGrad)" stroke="rgba(250,247,242,0.14)" stroke-width="1.5"/>
  <text x="88" y="458" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="rgba(250,247,242,0.6)">YOU COULD QUALIFY FOR</text>
  <text x="88" y="512" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#e88a2e">$4K–$35K</text>

  <!-- CTA pill -->
  <rect x="60" y="562" width="238" height="54" rx="27" fill="url(#amberGrad)" filter="url(#softShadow)"/>
  <text x="179" y="596" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#08363f" text-anchor="middle">Start Assessment →</text>

  <!-- Trust line -->
  <text x="330" y="596" font-family="Arial, sans-serif" font-size="15" fill="rgba(250,247,242,0.55)">No spam · No obligation</text>
</svg>
