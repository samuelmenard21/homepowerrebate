<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a2a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#08363f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4751c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e88a2e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" fill="url(#bgGradient)" rx="110"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="512" height="80" fill="url(#accentGradient)" rx="110"/>

  <!-- Lightning bolt / power icon (left side) -->
  <g transform="translate(80, 180)">
    <!-- Simplified lightning bolt -->
    <path d="M 40 0 L 60 40 L 30 40 L 50 100 L 0 50 L 35 50 Z" fill="#d4751c" opacity="0.8"/>
  </g>

  <!-- Main text: "Home" on top line -->
  <text x="160" y="220" font-family="Inter, -apple-system, sans-serif" font-size="72" font-weight="700" fill="white" letter-spacing="-2">
    Home
  </text>

  <!-- "Power Rebate" on second line -->
  <text x="160" y="300" font-family="Inter, -apple-system, sans-serif" font-size="68" font-weight="600" fill="url(#accentGradient)" letter-spacing="-1">
    Power Rebate
  </text>

  <!-- Subtle accent line under text -->
  <rect x="160" y="320" width="280" height="3" fill="#d4751c" rx="2"/>
</svg>
