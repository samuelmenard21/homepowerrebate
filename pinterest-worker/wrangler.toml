name = "pinterest-automation"
main = "index.js"
compatibility_date = "2024-01-01"

# Scheduled trigger: run 4 times daily.
# Cloudflare crons are UTC. These are 6am / 12pm / 6pm / 10pm Pacific (UTC-7).
[triggers]
crons = ["0 1,5,13,19 * * *"]

# Secrets (set via `wrangler secret put`)
# PINTEREST_ACCESS_TOKEN = your_pinterest_api_token (set via CLI)
# PINTEREST_BOARD_ID = your_board_id (set via CLI)
