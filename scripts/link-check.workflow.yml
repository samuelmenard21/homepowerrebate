name: Monthly link check
on:
  schedule:
    - cron: "0 14 3 * *"
  workflow_dispatch:
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Internal links (fails the run if any are broken)
        run: python3 scripts/check_links.py
      - name: External links (report only; many sites block bots, so review before acting)
        run: python3 scripts/check_links.py --external | tee external-links.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: external-links
          path: external-links.txt
